# PR の検証。デプロイのワークフローと同じ検証を、マージの前に流す（デプロイはしない）。
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じ PR に続けて push したら、古い実行は捨てる。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - run: dotnet restore split-file/split-file.csproj
      - run: dotnet build --no-restore split-file/split-file.csproj
